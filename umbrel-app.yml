releaseNotes: >-
  v2.1.2:
  - Fix: Fixed React blank/black screen crash caused by undefined property access in ProfitabilityWidget.
  - Added ErrorBoundary components across all dashboard widgets for crash resilience.
  - Fixed node startup crash on IPv6 networks caused by upstream kaspad externalip syntax parsing.
  - 10 BPS GHOSTDAG live block animation canvas rendering real-time network tip blocks.
  - Autonomous 24/7 telemetry collector daemon with zero-loss background polling.
  - Multi-stage IBD tracking (Headers, Block DAG, UTXO Indexing) with dual connection endpoints (LAN IPv4 + umbrel.local).
  - Permanent mined block rewards ledger with celebration confetti overlay.
  - Live container log streamer with hover-to-pause and auto-scroll controls.
  - Full P2P swarm telemetry table showing peer IPs, protocol versions, latency, and mempool status.
  - 6-Month tiered storage engine compressing historical metrics to <4 MB.
  - Authenticated Danger Zone with confirmation safety gate to reset telemetry if needed.
