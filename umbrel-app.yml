id: kaspa-stratum-manager
name: Kaspa Solo Mining Console
tagline: All-in-one solo mining stack with bundled Rusty Kaspad node and ASIC manager
category: Crypto
version: "2.0.0"
port: 8080
description: >-
  The ultimate zero-dependency Kaspa solo mining suite for Umbrel.
  Runs your own local Rusty Kaspad node, official Stratum Bridge v2.0.1,
  and a high-performance management dashboard with tuned ASIC presets
  for IceRiver, Antminer, Desiwe, and Goldshell miners.
