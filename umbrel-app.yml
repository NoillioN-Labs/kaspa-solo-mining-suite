releaseNotes: >-
  Rebuilt from the ground up:
  - Bundled Rusty Kaspad node for 100% self-contained solo mining (no external app dependency).
  - High-impact animated celebration screen with confetti particles on block discovery.
  - Expanded ASIC tuning presets (IceRiver KS0/1/2/3/5/7, Antminer KS3/5, Desiwe K11, Goldshell).
  - Modern, ultra-lightweight Vite + React dashboard with Dark/Light mode.
