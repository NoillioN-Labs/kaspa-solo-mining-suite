version: "3.7"

services:
  kaspad:
    build:
      context: ./kaspad
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "16111:16111"
    volumes:
      - "${APP_DATA_DIR:-.}/data:/app/data"
    command: >
      --utxoindex
      --appdir /app/data
      --listen=0.0.0.0:16111
      --rpclisten=0.0.0.0:16110
      --rpclisten-json=0.0.0.0:18110
    healthcheck:
      test: ["CMD", "kaspactl", "get-info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bridge:
    image: onemorebsmith/kaspa-stratum-bridge:latest
    restart: on-failure
    stop_grace_period: 20s
    depends_on:
      - kaspad
    ports:
      - "55555:5555/tcp" # Dedicated Stratum TCP Port for ASICs (Fixed for Umbrel)
    command: >
      /app/kaspa-stratum-bridge 
      --miningaddr kaspa:qxxx 
      --kaspadaddr kaspad:16110

  web:
    build:
      context: ./web
    restart: on-failure
    depends_on:
      - bridge
      - kaspad
    ports:
      - "8080:8080"
