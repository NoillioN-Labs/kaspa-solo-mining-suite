version: "3.7"

services:
  # Umbrel Reverse Proxy Adapter
  app_proxy:
    environment:
      APP_HOST: kaspa-solo-mining_web_1
      APP_PORT: 8080

  # 1. Bundled Rusty Kaspad Node (Full P2P Daemon)
  kaspad:
    image: kaspanet/rusty-kaspad:latest
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "16111:16111" # Kaspa Mainnet P2P
    volumes:
      - "${APP_DATA_DIR}/kaspad_data:/root/.rusty-kaspa"
    command:
      - "--rpc-listen=0.0.0.0:16110"
      - "--listen=0.0.0.0:16111"
      - "--rpclisten-borsh=0.0.0.0:17110"
      - "--rpclisten-json=0.0.0.0:18110"

  # 2. Rusty Kaspa Stratum Bridge v2.0.1
  bridge:
    image: ghcr.io/noillion-labs/kaspa-stratum-manager:1.3.0@sha256:fe7075cd5897c2cb20291728213f59b9c325912f48ffce2268b0bbb439ef8fd7
    restart: on-failure
    stop_grace_period: 20s
    depends_on:
      - kaspad
    ports:
      - "5555:5555/tcp" # Dedicated Stratum TCP Port for ASICs
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    command:
      - "/usr/local/bin/stratum-bridge"
      - "--config=/data/config.yaml"
      - "--node-mode=external"
      - "--kaspad-address=kaspad:16110"
      - "--web-dashboard-port=:3030"

  # 3. Solo Mining Management Console & Dashboard
  web:
    image: ghcr.io/noillion-labs/kaspa-solo-mining-suite:latest
    restart: on-failure
    depends_on:
      - bridge
      - kaspad
    environment:
      NODE_ENV: production
      PORT: 8080
      KASPAD_RPC: kaspad:16110
      BRIDGE_URL: http://bridge:3030
      DATA_DIR: /data
    volumes:
      - "${APP_DATA_DIR}/data:/data"
